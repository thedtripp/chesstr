<!doctype html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link rel="stylesheet" href="static/chessground/chessground.base.css">
    <link rel="stylesheet" href="static/chessground/chessground.brown.css">
    <link rel="stylesheet" href="static/chessground/chessground.cburnett.css">
    <link rel="stylesheet" href="static/styles.css">
    <link rel="shortcut icon" href="static/img/rook.png">
    <script type="module" src="static/trainer.js"></script>
    <title>chesstr</title>
</head>

<body>
    <div class="chesstr-app">
        <header class="site-header">
            <a href="." class="brand">♞ chesstr</a>
        </header>

        <main class="challenge-container">
            <div class="board-wrap">
                <div id="board" class="challenge-board"></div>
            </div>

            <div class="challenge-details-container">
                <div class="control-group">
                    <label for="opening-select">Opening</label>
                    <select id="opening-select"></select>
                    <button id="choose-openings-btn" class="link-button" type="button">Choose openings…</button>
                </div>
                <div class="control-group">
                    <label for="color-select">Play as</label>
                    <select id="color-select">
                        <option value="w">White</option>
                        <option value="b">Black</option>
                    </select>
                </div>
                <label class="toggle-row" for="guided-toggle">
                    <input type="checkbox" id="guided-toggle">
                    Guided mode
                </label>

                <p class="challenge-details-title" id="opening-title"></p>
                <p class="curriculum-progress" id="curriculum-progress"></p>
                <p id="result" class="challenge-details-status-message result-info">What's the next move?</p>

                <div class="button-row">
                    <button id="hint" class="challenge-details-button">Hint</button>
                    <button id="continue-btn" class="challenge-details-button">Continue</button>
                </div>
                <button id="drill" class="challenge-details-button challenge-details-button-primary">
                    Drill weak spots<span id="drill-count" class="drill-badge"></span>
                </button>
            </div>
        </main>
    </div>

    <div id="picker-overlay" class="picker-overlay" hidden>
        <div class="picker-modal">
            <div class="picker-header">
                <h2>Choose your openings</h2>
                <p>Pick which openings are part of your training path, on top of the ones already curated for you.</p>
            </div>

            <div class="picker-toolbar">
                <div class="picker-search-field">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" id="picker-search" placeholder="Search openings, e.g. Sicilian, Vienna, Caro-Kann" autocomplete="off" spellcheck="false" />
                </div>
                <div class="picker-sort-field">
                    <label for="picker-sort">Sort</label>
                    <select id="picker-sort">
                        <option value="popularity-desc">Most popular</option>
                        <option value="name">Name (A–Z)</option>
                        <option value="lines-desc">Most lines</option>
                        <option value="depth-desc">Deepest</option>
                    </select>
                </div>
                <div class="picker-result-count" id="picker-result-count"></div>
            </div>

            <div class="picker-list" id="picker-list"></div>
            <div class="picker-empty-state" id="picker-empty-state" style="display: none">No openings match "<span id="picker-empty-query"></span>"</div>

            <div class="picker-footer">
                <div class="picker-footer-count"><strong id="picker-selected-count">0</strong> selected</div>
                <div class="picker-footer-buttons">
                    <button id="picker-cancel" class="challenge-details-button" type="button">Cancel</button>
                    <button id="picker-save" class="challenge-details-button-primary" type="button">Save</button>
                </div>
            </div>
        </div>
    </div>
</body>
